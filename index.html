<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5c94fc" />
    <title>スーパー野々村ブラザーズ</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main id="game-shell">
        <section id="game-container" aria-label="横スクロールゲーム">
            <canvas id="gameCanvas" width="960" height="540"></canvas>

            <div id="hud" aria-live="polite">
                <span id="hud-title">SUPER NONOMURA BROS</span>
                <span>COIN <strong id="coin-count">0</strong></span>
                <span>LIFE <strong id="life-count">1</strong></span>
                <span>TIME <strong id="time-count">300</strong></span>
            </div>

            <div id="start-screen" class="overlay">
                <div class="panel">
                    <p class="kicker">RETRO DOT SCROLL ACTION</p>
                    <h1>スーパー野々村ブラザーズ</h1>
                    <p>
                        スマホ：左下で移動、右下のJUMPでジャンプ。<br />
                        PC：← → / A D で移動、↑ / W / Space でジャンプ。
                    </p>
                    <button id="start-button" type="button">ゲームスタート</button>
                    <p class="small-note">
                        LINEで無音の時は、スタート後に画面をもう一度タップ。
                    </p>
                </div>
            </div>

            <div id="result-screen" class="overlay hidden">
                <div class="panel">
                    <p id="result-kicker" class="kicker">RESULT</p>
                    <h2 id="result-title">CLEAR!</h2>
                    <p id="result-message">ゴールしました。</p>
                    <button id="retry-button" type="button">もう一度遊ぶ</button>
                </div>
            </div>

            <div id="touch-controls" aria-label="スマホ操作ボタン">
                <div class="touch-left-group">
                    <button class="touch-button" data-key="left" aria-label="左へ移動">◀</button>
                    <button class="touch-button" data-key="right" aria-label="右へ移動">▶</button>
                </div>
                <button class="touch-button jump-button" data-key="jump" aria-label="ジャンプ">JUMP</button>
            </div>
        </section>
    </main>

    <!-- YouTube BGM用。LINE内ブラウザ対策のため、完全な0px非表示にはしない。 -->
    <div id="youtube-player" aria-hidden="true"></div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
</body>
</html>
